schemaVersion: "1"
kind: agent
name: pi
displayName: Pi
description: The local coding agent.
agent:
  image: "docker/sandbox-templates:shell-docker"
  aiFilename: AGENTS.md
  persistence: persistent
  entrypoint:
    run: [pi]

network:
  allowedDomains:
    - "pi.dev:443"
    - "http://localhost:8085"

environment:
  variables:
    IP_ADDRESS: "1"
    PI_CODING_AGENT_DIR: "~"

commands:
  install:
    - command: "npm install -g --ignore-scripts @earendil-works/pi-coding-agent"
      user: "1000"
      description: Install Pi
